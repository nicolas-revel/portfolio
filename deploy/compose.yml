services:
  portfolio:
    image: ghcr.io/nicolas-revel/portfolio:latest
    restart: unless-stopped
    # Seul Caddy, sur l'hôte, joint le site : jamais exposé directement.
    ports:
      - "127.0.0.1:3000:3000"
    # Identifiants SMTP du formulaire de contact, gardés hors du dépôt (voir README).
    env_file:
      - path: ./contact.env
        required: false
    # Le réseau du dépôt infra, où Stalwart répond au nom mail.nicolasrevel.fr : depuis un
    # conteneur, l'IP publique du VPS ne mène pas au serveur mail (réseaux Docker isolés, ufw).
    networks:
      - default
      - infra

networks:
  infra:
    name: infra_default
    external: true
